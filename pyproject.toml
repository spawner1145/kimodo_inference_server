[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimodo-inference-server"
version = "0.3.1"
description = "Local Kimodo v1.2 motion inference API with optional ConvRot INT8"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2", "numpy>=1.23", "safetensors>=0.4", "omegaconf>=2.3", "huggingface-hub>=0.27", "modelscope>=1.38.1", "tqdm>=4.66"]

[project.scripts]
kimodo-server = "kimodo_server.__main__:main"

[project.optional-dependencies]
test = ["httpx>=0.27"]
nf4 = ["bitsandbytes>=0.43.3", "accelerate>=0.26"]

[tool.setuptools.packages.find]
include = ["kimodo_server*", "kimodo", "kimodo.*"]

[tool.setuptools.package-data]
kimodo_server = ["web/*.html", "web/*.css", "web/*.js"]
kimodo = ["LICENSE", "ATTRIBUTIONS.MD", "assets/skeletons/**/*"]
